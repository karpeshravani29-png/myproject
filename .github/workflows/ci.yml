name: CI

on:
  push:
    branches: [ main, conflict, DEVOPS-8-login ]
  pull_request:
    branches: [ main, conflict, DEVOPS-8-login ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Package application
        run: |
          mkdir -p dist
          zip -r dist/myproject-${{ github.sha }}.zip app.py test_app.py requirements.txt

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: myproject-package
          path: dist/*.zip
